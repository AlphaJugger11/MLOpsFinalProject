name: CI Pipeline

on:
  push:
    branches: 
        - final_flow


jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    # - name: Lint (basic sanity check)
    #   run: |
    #     pip install flake8
    #     flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
    #     flake8 . --exit-zero --max-complexity=12 --max-line-length=150

    # - name: Validate Python imports (syntax check)
    #   run: |
    #     python -m py_compile $(git ls-files '*.py')

    # # ------------- DOCKER SECTION -------------
    # - name: Set up Docker Buildx
    #   uses: docker/setup-buildx-action@v2

    # - name: Login to GitHub Container Registry
    #   uses: docker/login-action@v3
    #   with:
    #     registry: ghcr.io
    #     username: ${{ github.actor }}
    #     password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker images
      run: |
        docker build -t server-image ./server
        docker build -t client-image ./client
        docker build -t serving-image ./serving
        docker build -t airflow-image ./airflow
        echo "All Docker images built successfully."

    - name: Validate docker-compose syntax
      run: |
        docker compose config

    - name: Spin up docker-compose for HEALTH CHECK ONLY
      run: |
        docker compose up -d
        sleep 15
        docker compose ps
        docker compose down

    # Optional – push images (enable if needed)
    # - name: Push images to GHCR
