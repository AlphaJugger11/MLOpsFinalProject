name: MLOps FL Training & Build Test

on:
  push:
    branches:
      - final_flow
 

jobs:
  federated-training:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
         python-version: '3.11'

 

    # - name: Build Docker Images
    #   run: |
    #     docker compose build

    - name: Run Full FL Pipeline (Server + 3 Clients + Airflow)
      run: |
        docker compose up --abort-on-container-exit --remove-orphans
      timeout-minutes: 15

    - name: Show server logs
      if: always()
      run: docker logs fl-server || true

    - name: Check that model was produced
      run: |
        if [ ! -f models/global_round_2.pth ]; then
            echo "❌ GLOBAL MODEL NOT PRODUCED — TRAINING FAILED"
            exit 1
        else
            echo "✅ Global FL Model Found — TRAINING SUCCESSFUL"
        fi

    - name: Docker Cleanup
      if: always()
      run: docker compose down --volumes --remove-orphans
