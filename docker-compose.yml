version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: fl-server
    ports:
      - "8070:8070"
    networks:
      - fl-net
    volumes:
      - models:/app/models
      - ./shared:/app/shared
    environment:
      - PYTHONPATH=/app

  client1:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: fl-client1
    depends_on:
      - server
    networks:
      - fl-net
    volumes:
      - ./federated_clients/client_1.csv:/app/client_1.csv
      - models:/app/models
      - ./shared:/app/shared
    environment:
      - SERVER_ADDR=server:8070
      - PYTHONPATH=/app
    command: ["--client_id", "client1", "--data", "/app/client_1.csv"]

  client2:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: fl-client2
    depends_on:
      - server
    networks:
      - fl-net
    volumes:
      - ./federated_clients/client_2.csv:/app/client_2.csv
      - models:/app/models
      - ./shared:/app/shared
    environment:
      - SERVER_ADDR=server:8070
      - PYTHONPATH=/app
    command: ["--client_id", "client2", "--data", "/app/client_2.csv"]

  client3:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: fl-client3
    depends_on:
      - server
    networks:
      - fl-net
    volumes:
      - ./federated_clients/client_3.csv:/app/client_3.csv
      - models:/app/models
      - ./shared:/app/shared
    environment:
      - SERVER_ADDR=server:8070
      - PYTHONPATH=/app
    command: ["--client_id", "client3", "--data", "/app/client_3.csv"]
  
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: fl-dashboard
    ports:
      - "8501:8501"
    depends_on:
      - server
      - serving
    networks:
      - fl-net


  serving:
    build:
      context: .
      dockerfile: serving/Dockerfile
    container_name: fl-serving
    ports:
      - "8000:8000"
    networks:
      - fl-net
    volumes:
      - models:/app/models
      - ./shared:/app/shared
      - ./serving:/app/serving
    environment:
      - PYTHONPATH=/app
    depends_on:
      - server

networks:
  fl-net:
    driver: bridge

volumes:
  models:
